name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run test suite
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Build standalone zipapp binary
        run: |
          python3 -m zipapp src -m "skills_manager.cli:main" -p "/usr/bin/env python3" -o skills
          chmod +x skills
          ./skills --help

      - name: Create GitHub Release and Upload Binary Asset
        uses: softprops/action-gh-release@v3
        with:
          files: skills
          generate_release_notes: true
          draft: false
          prerelease: false

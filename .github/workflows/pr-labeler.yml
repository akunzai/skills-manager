name: "PR Auto Labeler"

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels based on branch name prefix
        uses: actions/github-script@v9
        with:
          script: |
            const branch = context.payload.pull_request.head.ref || "";
            const match = branch.match(/^([a-zA-Z]+)\//);
            if (!match) {
              console.log(`No recognized prefix in branch name: "${branch}"`);
              return;
            }

            const prefix = match[1].toLowerCase();
            const prefixMap = {
              feat: "enhancement",
              feature: "enhancement",
              fix: "bug",
              bug: "bug",
              docs: "documentation",
              doc: "documentation",
              ci: "ci",
              build: "ci",
              chore: "chore",
              refactor: "refactor",
              test: "tests",
              tests: "tests",
              perf: "enhancement",
            };

            const primaryCategoryLabels = [
              "enhancement",
              "bug",
              "documentation",
              "ci",
              "chore",
              "refactor",
              "tests",
              "dependencies"
            ];

            const targetLabel = prefixMap[prefix];
            if (targetLabel) {
              const currentLabels = (context.payload.pull_request.labels || []).map(l => l.name);

              // Remove other conflicting primary category labels
              for (const oldLabel of currentLabels) {
                if (oldLabel !== targetLabel && primaryCategoryLabels.includes(oldLabel)) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.payload.pull_request.number,
                      name: oldLabel
                    });
                    console.log(`Removed conflicting label "${oldLabel}" from PR #${context.payload.pull_request.number}`);
                  } catch (err) {
                    console.log(`Failed to remove label "${oldLabel}": ${err.message}`);
                  }
                }
              }

              if (!currentLabels.includes(targetLabel)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  labels: [targetLabel]
                });
                console.log(`Successfully added label "${targetLabel}" to PR #${context.payload.pull_request.number}`);
              }
            }

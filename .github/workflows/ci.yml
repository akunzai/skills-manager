name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race ./...

      - name: Build binary
        run: go build -v ./cmd/skills

  windows:
    name: Test & Build (Windows)
    runs-on: windows-latest
    steps:
      # Without this the checkout arrives as CRLF and a byte-exact assertion
      # ends up testing git rather than the code.
      - name: Keep line endings unchanged
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      # No formatter and no vet pass: their answers are platform-independent,
      # and the job above already gave them. No race detector either — it needs
      # cgo and a C toolchain on Windows, which makes it a job that turns red
      # when a runner image changes rather than when the code does, and the
      # only concurrency here has no platform-specific branch.
      - name: Run tests
        run: go test ./...

      # Temporary measurement, not for merge.
      - name: Measure git spawn cost
        shell: bash
        run: |
          time (for i in $(seq 100); do git --version >/dev/null; done)
          mkdir -p "$RUNNER_TEMP/r" && cd "$RUNNER_TEMP/r" && git init -q
          time (for i in $(seq 100); do git rev-parse --git-dir >/dev/null; done)

      - name: Time engine tests
        shell: bash
        run: |
          go test -count=1 -v ./internal/engine/ > engine.log
          grep -E '^ok|^FAIL' engine.log
          perl -ne 'print "$2 $1\n" if /^--- \w+: (\S+) \(([0-9.]+)s\)/' engine.log | sort -rn > times.txt
          awk '{s+=$1} END {print "tests", NR, "sum", s "s"}' times.txt
          head -25 times.txt
          echo "--- by file prefix"
          awk '{split($2,a,"/"); print $1, a[1]}' times.txt | awk '$1>=1' | wc -l | xargs echo "tests >= 1s:"

      - name: Build binary
        run: go build -v ./cmd/skills

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov authenticates the upload with this job's OIDC token, so the
      # repository needs no upload secret.
      # https://github.com/codecov/codecov-action#using-oidc
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # shell: bash turns on pipefail, so a failing test still fails the step
      # through tee. The unspecified default shell does not.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
      - name: Run tests
        shell: bash
        run: go test -v -race -coverprofile=coverage.out ./... | tee test.log

      - name: Report test count and coverage
        run: scripts/test-stats.sh test.log coverage.out >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          disable_search: true
          use_oidc: true

      - name: Build binary
        run: go build -v -o bin/ ./cmd/skills

  windows:
    name: Test & Build (Windows)
    runs-on: windows-latest
    steps:
      # C: on hosted Windows runners is far slower than D:, and TEMP (so every
      # t.TempDir and fixture repository) defaults to C:. The runner context is
      # not available in job-level env, hence GITHUB_ENV. GOCACHE stays on C;
      # measured on D, it made the test step slower, not faster.
      # https://github.com/actions/runner-images/issues/8755
      - name: Keep temporary files on the D drive
        shell: bash
        run: |
          {
            echo "TEMP=$RUNNER_TEMP"
            echo "TMP=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      # Without this the checkout arrives as CRLF and a byte-exact assertion
      # ends up testing git rather than the code.
      - name: Keep line endings unchanged
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      # No formatter and no vet pass: their answers are platform-independent,
      # and the job above already gave them. No race detector either — it needs
      # cgo and a C toolchain on Windows, which makes it a job that turns red
      # when a runner image changes rather than when the code does, and the
      # only concurrency here has no platform-specific branch.
      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build -v -o bin/ ./cmd/skills

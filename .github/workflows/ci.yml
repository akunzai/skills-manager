name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # A PR touching only these builds nothing; main still runs on every push.
    # skills/ stays in: the guide SKILL.md is embedded in the binary.
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov authenticates the upload with this job's OIDC token, so the
      # repository needs no upload secret.
      # https://github.com/codecov/codecov-action#using-oidc
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # shell: bash turns on pipefail, so a failing test still fails the step
      # through tee. The unspecified default shell does not.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
      - name: Run tests
        shell: bash
        run: go test -v -race -coverprofile=coverage.out ./... | tee test.log

      - name: Report test count and coverage
        run: scripts/test-stats.sh test.log coverage.out >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          disable_search: true
          use_oidc: true

      - name: Build binary
        run: go build -v -o bin/ ./cmd/skills

  windows:
    name: Test & Build (Windows)
    runs-on: windows-latest
    steps:
      # C: on hosted Windows runners is far slower than D:, and TEMP (so every
      # t.TempDir and fixture repository) defaults to C:, as do GOCACHE and
      # GOMODCACHE, which setup-go's cache restores into. The runner context is
      # not available in job-level env, hence GITHUB_ENV.
      # https://github.com/actions/runner-images/issues/8755
      - name: Keep temporary files and Go caches on the D drive
        shell: bash
        run: |
          {
            echo "TEMP=$RUNNER_TEMP"
            echo "TMP=$RUNNER_TEMP"
            echo "GOCACHE=$RUNNER_TEMP\go-build"
            echo "GOMODCACHE=$RUNNER_TEMP\go-mod"
          } >> "$GITHUB_ENV"

      # Without this the checkout arrives as CRLF and a byte-exact assertion
      # ends up testing git rather than the code.
      - name: Keep line endings unchanged
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      # No formatter and no vet pass: their answers are platform-independent,
      # and the job above already gave them. No race detector either — it needs
      # cgo and a C toolchain on Windows, which makes it a job that turns red
      # when a runner image changes rather than when the code does, and the
      # only concurrency here has no platform-specific branch.
      #
      # engine and cli tests are mostly sequential and bound by spawning git,
      # so each is built once and its tests split across processes that use
      # the cores sequential tests leave idle. The script prints build and
      # per-shard times.
      - name: Run tests
        shell: bash
        run: scripts/test-shards.sh 4 ./internal/engine ./internal/cli

      - name: Build binary
        run: go build -v -o bin/ ./cmd/skills

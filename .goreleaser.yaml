version: 2

project_name: skills

builds:
  - id: skills
    main: ./cmd/skills
    binary: skills
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/akunzai/skills-manager/internal/updater.Version={{.Version}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - skills.schema.json

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "
      - "^merge "
  groups:
    - title: "🚀 Features & Enhancements"
      regexp: '^.*?feat(\([^\)]+\))?:.*$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\([^\)]+\))?:.*$'
      order: 1
    - title: "📦 Dependency Updates"
      regexp: '^.*?(deps|dependencies)(\([^\)]+\))?:.*$'
      order: 2
    - title: "📚 Documentation"
      regexp: '^.*?docs?(\([^\)]+\))?:.*$'
      order: 3
    - title: "⚙️ CI/CD & Build"
      regexp: '^.*?(ci|build|workflow)(\([^\)]+\))?:.*$'
      order: 4
    - title: "🧹 Refactoring & Chores"
      regexp: '^.*?(refactor|chore|maintenance|perf)(\([^\)]+\))?:.*$'
      order: 5
    - title: "🧪 Tests"
      regexp: '^.*?tests?(\([^\)]+\))?:.*$'
      order: 6
    - title: "💬 Other Changes"
      order: 99

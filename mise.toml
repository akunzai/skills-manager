[tools]
go = "1.27"
"github:AmanVarshney01/tcut" = "latest"

[tasks.demo]
description = "Rebuild the README terminal demo"
run = "tcut scripts/demo.video.ts"

[tasks.check]
description = "Run the same checks CI does, in the same order"
run = """
set -e
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "The following files are not gofmt'd:"
  echo "$unformatted"
  exit 1
fi
go vet ./...
go test -race ./...
go build ./cmd/skills
"""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skills-manager"
dynamic = ["version"]
description = "Global skills manager for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Charley Wu", email = "akunzai@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
skills = "skills_manager.cli:main"
skills-manager = "skills_manager.cli:main"

[project.urls]
Homepage = "https://github.com/akunzai/skills-manager"
Repository = "https://github.com/akunzai/skills-manager"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_manager"]

[tool.hatch.version]
path = "src/skills_manager/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
